name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' }}
      browser: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' || steps.filter.outputs.browser == 'true' }}
      runtime: ${{ github.ref_type == 'tag' || steps.filter.outputs.runtime == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!docs/**'
              - '!screenshots/**'
              - '!*.md'
              - '!LICENSE'
            browser:
              - 'screenshots/**'
            runtime:
              - '{apps/**,crates/**,Cargo.toml,Cargo.lock,rust-toolchain.toml,package.json,package-lock.json,Dockerfile,.dockerignore}'

  check:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: Check and build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Run checks and tests
        run: npm run check

      - name: Build applications
        run: npm run build

  ui:
    needs: changes
    if: >-
      needs.changes.outputs.browser == 'true' &&
      (github.event_name != 'push' || github.ref_type == 'tag')
    name: Browser tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run browser and visual regression tests
        run: npm run test:e2e:docker
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  container-dev:
    name: Publish development container
    needs: [changes, ci-result]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.ci-result.result == 'success' && needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate development image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: type=raw,value=dev
          labels: |
            org.opencontainers.image.title=OpScope
            org.opencontainers.image.description=Operational dashboard for software delivery monitoring

      - name: Build and publish development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=container-dev
          cache-to: type=gha,scope=container-dev,mode=max
          provenance: mode=max
          sbom: true

  ci-result:
    name: CI result
    if: always()
    needs: [changes, check, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to pass
        env:
          FAILED: ${{ needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
