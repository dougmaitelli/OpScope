name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Verify tag and application versions
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node --print "require('./package.json').version")"
          tauri_version="$(node --print "require('./apps/desktop/tauri.conf.json').version")"
          cargo_version="$(cargo metadata --format-version 1 --no-deps | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).packages.find(item => item.name === 'opsscope-core').version));")"

          if [[ "$GITHUB_REF_NAME" != "v$cargo_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match Cargo version v$cargo_version." >&2
            exit 1
          fi

          for version in "$package_version" "$tauri_version" "$cargo_version"; do
            if [[ "$version" != "$tag_version" ]]; then
              echo "Tag version $tag_version does not match application version $version." >&2
              exit 1
            fi
          done

      - name: Run checks and tests
        run: npm run check

  create_release:
    name: Create draft release
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or find GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id" |
              head -n 1
          )"

          if [[ -z "$release_id" ]]; then
            prerelease=false
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              prerelease=true
            fi

            release_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              --field tag_name="$GITHUB_REF_NAME" \
              --field name="OpsScope ${GITHUB_REF_NAME}" \
              --field target_commitish="$GITHUB_SHA" \
              --field generate_release_notes=true \
              --field draft=true \
              --field prerelease="$prerelease" \
              --jq .id)"
          fi

          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Draft release ID is invalid: $release_id" >&2
            exit 1
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs:
      - validate
      - create_release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-22.04
            asset_suffix: linux_x86_64.AppImage
          - name: Windows
            runner: windows-latest
            asset_suffix: windows_x86_64.exe
          - name: macOS universal
            runner: macos-latest
            asset_suffix: macos_universal.app.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify draft release handoff
        shell: bash
        env:
          RELEASE_ID: ${{ needs.create_release.outputs.release_id }}
        run: |
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "Draft release ID was not propagated." >&2
            exit 1
          fi

      - name: Build Linux portable executable
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npx --no-install tauri build --bundles appimage

      - name: Build Windows portable executable
        if: runner.os == 'Windows'
        run: npm run desktop:build

      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        working-directory: apps/desktop
        run: npx --no-install tauri build --target universal-apple-darwin --bundles app

      - name: Stage Linux release asset
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_ASSET: ${{ runner.temp }}/opsscope_${{ github.ref_name }}_${{ matrix.asset_suffix }}
          RAW_RELEASE_ASSET: ${{ runner.temp }}/opsscope_${{ github.ref_name }}_linux_x86_64
        run: |
          source_asset="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$source_asset" ]]; then
            echo "Linux AppImage was not produced." >&2
            exit 1
          fi
          cp "$source_asset" "$RELEASE_ASSET"
          chmod +x "$RELEASE_ASSET"
          cp target/release/opsscope-desktop "$RAW_RELEASE_ASSET"
          chmod +x "$RAW_RELEASE_ASSET"

      - name: Stage Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_ASSET: ${{ runner.temp }}/opsscope_${{ github.ref_name }}_${{ matrix.asset_suffix }}
        run: Copy-Item target/release/opsscope-desktop.exe $env:RELEASE_ASSET

      - name: Stage macOS release asset
        if: runner.os == 'macOS'
        env:
          RELEASE_ASSET: ${{ runner.temp }}/opsscope_${{ github.ref_name }}_${{ matrix.asset_suffix }}
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          target/universal-apple-darwin/release/bundle/macos/OpsScope.app
          "$RELEASE_ASSET"

      - name: Upload portable desktop asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: ${{ runner.temp }}/opsscope_${{ github.ref_name }}_${{ matrix.asset_suffix }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "$RELEASE_ASSET" --clobber

      - name: Upload raw Linux binary
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: ${{ runner.temp }}/opsscope_${{ github.ref_name }}_linux_x86_64
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "$RELEASE_ASSET" --clobber

  container:
    name: Container
    needs: desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=OpsScope
            org.opencontainers.image.description=Operational dashboard for software delivery monitoring

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  publish-release:
    name: Publish release
    needs:
      - create_release
      - desktop
      - container
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create_release.outputs.release_id }}
        run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --field draft=false
