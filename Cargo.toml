[workspace]
members = [
  "apps/desktop",
  "apps/server",
  "crates/ciwatcher-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
ciwatcher-core = { path = "crates/ciwatcher-core" }
http-body-util = "0.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = "2.11.6"
tauri-build = "2.6.3"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
