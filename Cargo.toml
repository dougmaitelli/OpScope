[workspace]
members = [
  "apps/desktop",
  "apps/server",
  "crates/ciwatcher-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
ciwatcher-core = { path = "crates/ciwatcher-core" }
getrandom = "0.4.3"
http-body-util = "0.1.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = "2.11.6"
tauri-build = "2.6.3"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
zeroize = "1.9.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
